name: Report a listing or partner
description: Tell the FivePRS team about a broken, unsafe or rule-breaking listing or partner.
title: "Report: "
labels: [report]
body:
  - type: input
    id: listing
    attributes:
      label: Listing or partner id
      description: For an asset, the last part of its address, fiveprs.org/assets/<id>. For a partner, their name.
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: Reason
      options:
        - The download, invite, website or server is broken
        - It doesn't work with FivePRS
        - Misleading details or offer
        - Malware or suspicious behaviour
        - Stolen or leaked content
        - It breaks another listing rule
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What happened? Include versions, console errors or links that help us check.
    validations:
      required: true
